<text x="0" y="618" fill="#71777f" font-size="9.4">Survey-weighted logistic regression, one per outcome, adjusted for party, education, age, income,</text>
<text x="0" y="630" fill="#71777f" font-size="9.4">gender, wave and every other news source.</text>
<text x="0" y="642" fill="#71777f" font-size="9.4">Every question is drawn as asked, so the percentage is the share who gave that answer and the odds</text>
<text x="0" y="654" fill="#71777f" font-size="9.4">ratio is for giving it. The axis therefore means “more likely to answer this way”, not one</text>
<text x="0" y="666" fill="#71777f" font-size="9.4">substantive direction: the affirmative answer is agreement on a belief item, trust on a trust item.</text>
<text x="0" y="678" fill="#71777f" font-size="9.4">† fewer than half the waves of the best-covered outcome. Cross-sectional associations, confounded</text>
<text x="0" y="690" fill="#71777f" font-size="9.4">with selective exposure by construction: they fix the ordering of predictors, not transmission rates.</text>
