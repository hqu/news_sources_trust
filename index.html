<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where political news comes from, and what people believe — CHIP50</title>
<style>
:root{
  --ink:#16181d; --mid:#71777f; --faint:#ccd1d6; --hair:#e6e9ec;
  --obs:#2f6f8f; --semi:#4f5f9e; --priv:#6b4c9a; --bg:#ffffff; --wash:#f4f7f9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1500px;margin:0 auto;padding:34px 30px 70px}
h1{font-size:25px;font-weight:700;margin:0 0 5px}
.sub{color:var(--mid);font-size:14px;margin:0 0 6px}
.track{letter-spacing:.19em;text-transform:uppercase;font-size:10.5px;font-weight:700;color:var(--mid)}
.rule{height:1px;background:var(--hair);margin:18px 0 22px}
.cols{display:grid;grid-template-columns:290px 1fr;gap:34px;align-items:start}
.panel{border:1px solid var(--hair);border-radius:11px;padding:15px 16px;background:var(--bg)}
.panel + .panel{margin-top:16px}
.grouphead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  padding:7px 0;user-select:none;border-top:1px solid var(--hair)}
.grouphead:first-of-type{border-top:none}
.grouphead .t{font-size:12.5px;font-weight:600}
.chev{color:var(--faint);font-size:11px;transition:transform .15s}
.open .chev{transform:rotate(90deg)}
.groupbody{display:none;padding:2px 0 8px}
.open + .groupbody{display:block}
label.row{display:flex;gap:8px;align-items:flex-start;padding:3.5px 0;cursor:pointer;font-size:13px}
label.row.sub2{padding-left:20px;font-size:12.3px;color:var(--mid)}
input[type=checkbox],input[type=radio]{margin:3px 0 0;accent-color:var(--obs);flex:none}
.meta{color:var(--mid);font-size:11.2px;margin-left:auto;padding-left:8px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden;margin-bottom:13px}
.seg button{flex:1;border:0;background:var(--bg);padding:7px 4px;font:inherit;font-size:12.5px;
  color:var(--mid);cursor:pointer}
.seg button.on{background:var(--wash);color:var(--ink);font-weight:600}
.plots{display:flex;gap:22px;overflow-x:auto;padding-bottom:6px}
.plot{flex:none}
.plot h3{font-size:13px;margin:0 0 1px;font-weight:600}
.plot .pmeta{color:var(--mid);font-size:11px;margin:0 0 7px}
table{border-collapse:collapse;width:100%;font-size:12.3px;margin-top:8px}
th,td{text-align:right;padding:5.5px 9px;border-bottom:1px solid var(--hair);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mid);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
tbody tr:hover{background:var(--wash)}
.note{color:var(--mid);font-size:11.8px;line-height:1.65;margin-top:9px}
.badge{display:inline-block;border:1px solid var(--faint);border-radius:4px;padding:0 5px;
  font-size:10px;color:var(--mid);margin-left:6px;vertical-align:1px}
.btn{border:1px solid var(--hair);background:var(--bg);border-radius:7px;padding:5px 10px;
  font:inherit;font-size:11.6px;color:var(--mid);cursor:pointer;margin-right:6px}
.btn:hover{background:var(--wash);color:var(--ink)}
.empty{color:var(--mid);padding:46px 0;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <h1>Where political news comes from, and what people believe</h1>
  <p class="sub">Aggregated estimates from the Civic Health and Institutions Project (CHIP50), June 2022 – May 2026.
     Each point is an adjusted odds ratio from one model per outcome.</p>
  <div class="rule"></div>

  <div class="cols">
    <div>
      <div class="panel">
        <div class="track" style="margin-bottom:9px">Outcome</div>
        <div id="outcomes"></div>
        <div style="margin-top:11px">
          <button class="btn" id="clearOut">Clear</button>
          <button class="btn" id="allConsp">All 4 conspiracy items</button>
        </div>
      </div>

      <div class="panel">
        <div class="track" style="margin-bottom:9px">News source</div>
        <div class="seg" id="levelSeg">
          <button data-level="regime" class="on">Regimes</button>
          <button data-level="channel">Channels</button>
        </div>
        <div id="predictors"></div>
        <div style="margin-top:11px">
          <button class="btn" id="allPred">Select all</button>
          <button class="btn" id="nonePred">None</button>
          <button class="btn" id="resetPred">Reset to defaults</button>
        </div>
      </div>
    </div>

    <div>
      <div class="track" style="margin-bottom:10px">Forest plots</div>
      <div class="plots" id="plots"></div>
      <div class="rule" style="margin:26px 0 18px"></div>
      <div class="track" style="margin-bottom:4px">Underlying estimates</div>
      <div id="tables"></div>
      <p class="note" id="footnote"></p>
    </div>
  </div>
</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const PAL={ink:"#16181d",mid:"#71777f",faint:"#ccd1d6",hair:"#e6e9ec",
           obs:"#2f6f8f",semi:"#4f5f9e",priv:"#6b4c9a",wash:"#f4f7f9"};
let DATA=null, level="regime", selOut=[], selPred=new Set();

const GROUPS=[["Trust in science",["science"]],
              ["Agencies",["cdc","fda"]],
              ["Profession",["doctors"]],
              ["Corporates",["pharma"]],
              ["Elites",["fauci","rfk","musk"]],
              ["Conspiracy beliefs",["consp1","consp2","consp3","consp4"]],
              ["Election",["denial"]]];

function fail(msg){
  document.getElementById("plots").innerHTML=
    '<div style="border:1px solid #e6e9ec;border-radius:11px;padding:20px;color:#6b4c9a">'+
    '<strong>The dashboard could not load its data.</strong><br>'+msg+'</div>';
}
function boot(d){
  try{ DATA=d; init(); }
  catch(err){ fail("Error while building the view: "+err.message); throw err; }
}
(function(){
  const el=document.getElementById("payload");
  const raw=el?el.textContent.trim():"";
  if(raw && raw[0]==="{"){ boot(JSON.parse(raw)); return; }      // self-contained file
  fetch("data.json").then(r=>{                                    // served copy
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();})
    .then(boot)
    .catch(e=>fail(
      "It tried to read <code>data.json</code> and got: "+e.message+
      ".<br>If you opened this file directly from Finder, your browser blocks that read. "+
      "Use <code>index_standalone.html</code>, which has the data built in, or run "+
      "<code>python3 -m http.server</code> in this folder and open localhost."));
})();

function O(k){return DATA.outcomes.find(o=>o.key===k);}
function ests(o){return (level==="regime"?o.regime:o.channel).estimates;}
function predList(){
  if(level==="regime") return DATA.meta.regimes.map(r=>({key:r.key,label:r.label,group:null}));
  const out=[];
  DATA.meta.regimes.forEach(r=>r.channels.forEach(c=>out.push({key:c.key,label:c.label,group:r.label})));
  return out;
}
function defaultsFor(keys){
  const s=new Set();
  keys.forEach(k=>{const o=O(k); if(!o) return;
    if(level==="regime") o.default_on.forEach(x=>s.add(x));
    else{ // channels inside the default regimes
      const want=new Set(o.default_on);
      DATA.meta.regimes.filter(r=>want.has(r.key)).forEach(r=>r.channels.forEach(c=>s.add(c.key)));
    }});
  return s;
}

function init(){
  const host=document.getElementById("outcomes");
  GROUPS.forEach(([name,keys],gi)=>{
    const avail=keys.filter(k=>O(k));
    if(!avail.length) return;
    // Progressive disclosure applies only to the OTHER trust institutions —
    // agencies, profession, corporates, elites. The conspiracy items and election
    // denial are primary outcomes and stay open.
    const openByDefault = ["Trust in science","Conspiracy beliefs","Election"].includes(name);
    const h=document.createElement("div");
    h.className="grouphead"+(openByDefault?" open":"");
    h.innerHTML=`<span class="t">${name}</span><span class="meta">${avail.length}</span><span class="chev">▶</span>`;
    const b=document.createElement("div"); b.className="groupbody";
    avail.forEach(k=>{
      const o=O(k);
      const l=document.createElement("label"); l.className="row";
      l.innerHTML=`<input type="checkbox" value="${k}"><span>${o.label}</span>
                   <span class="meta">${o.regime.prevalence.toFixed(0)}%</span>`;
      b.appendChild(l);
    });
    h.onclick=()=>h.classList.toggle("open");
    host.appendChild(h); host.appendChild(b);
  });
  host.addEventListener("change",e=>{
    if(e.target.type!=="checkbox") return;
    const k=e.target.value;
    if(e.target.checked){ selOut.push(k);
      defaultsFor([k]).forEach(x=>selPred.add(x));      // adverse predictors on by default
    } else selOut=selOut.filter(x=>x!==k);
    renderPred(); draw();
  });
  document.getElementById("clearOut").onclick=()=>{
    selOut=[];host.querySelectorAll("input").forEach(i=>i.checked=false);draw();};
  document.getElementById("allConsp").onclick=()=>{
    ["consp1","consp2","consp3","consp4"].forEach(k=>{
      if(!O(k)||selOut.includes(k))return; selOut.push(k);
      const i=host.querySelector(`input[value="${k}"]`); if(i){i.checked=true;i.closest(".groupbody").previousElementSibling.classList.add("open");}
    });
    selPred=defaultsFor(selOut); renderPred(); draw();};
  document.getElementById("levelSeg").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    level=b.dataset.level;
    document.querySelectorAll("#levelSeg button").forEach(x=>x.classList.toggle("on",x===b));
    selPred=defaultsFor(selOut); renderPred(); draw();});
  document.getElementById("allPred").onclick=()=>{selPred=new Set(predList().map(p=>p.key));renderPred();draw();};
  document.getElementById("nonePred").onclick=()=>{selPred=new Set();renderPred();draw();};
  document.getElementById("resetPred").onclick=()=>{selPred=defaultsFor(selOut);renderPred();draw();};

  // first load: trust in science, with the regimes predicting the LOWEST trust switched on
  const first=DATA.outcomes.find(o=>o.is_default)||DATA.outcomes[0];
  selOut=[first.key];
  host.querySelector(`input[value="${first.key}"]`).checked=true;
  selPred=defaultsFor(selOut);
  renderPred(); draw();
}

function renderPred(){
  const host=document.getElementById("predictors"); host.innerHTML="";
  if(level==="regime"){
    predList().forEach(p=>host.appendChild(predRow(p,false)));
  }else{
    DATA.meta.regimes.forEach(r=>{
      const h=document.createElement("div"); h.className="grouphead open";
      h.innerHTML=`<span class="t">${r.label}</span><span class="chev">▶</span>`;
      h.onclick=()=>h.classList.toggle("open");
      const b=document.createElement("div"); b.className="groupbody";
      r.channels.forEach(c=>b.appendChild(predRow({key:c.key,label:c.label},true)));
      host.appendChild(h); host.appendChild(b);
    });
  }
}
// delegated once at startup: renderPred() rebuilds its children, so a listener attached
// inside renderPred would either be duplicated or (with {once:true}) die after one toggle.
document.getElementById("predictors").addEventListener("change",e=>{
  if(e.target.type!=="checkbox")return;
  e.target.checked?selPred.add(e.target.value):selPred.delete(e.target.value);
  draw();});
function predRow(p,sub){
  const l=document.createElement("label"); l.className="row"+(sub?" sub2":"");
  const any=selOut.length?ests(O(selOut[0])).find(e=>e.key===p.key):null;
  const occ=any?` <span class="meta">${any.pct_occupying.toFixed(0)}%</span>`:"";
  l.innerHTML=`<input type="checkbox" value="${p.key}" ${selPred.has(p.key)?"checked":""}>
               <span>${p.label}</span>${occ}`;
  return l;
}

function draw(){
  const plots=document.getElementById("plots"), tables=document.getElementById("tables");
  plots.innerHTML=""; tables.innerHTML="";
  const labelOf=k=>{const p=predList().find(x=>x.key===k);return p?p.label:k;};
  if(!selOut.length||!selPred.size){
    plots.innerHTML='<div class="empty">Choose at least one outcome and one news source.</div>';
    document.getElementById("footnote").textContent=""; return;
  }
  const rows=[...selPred].filter(k=>ests(O(selOut[0])).some(e=>e.key===k));
  // shared x-domain across facets so the columns are comparable
  let lo=1,hi=1;
  selOut.forEach(k=>ests(O(k)).filter(e=>rows.includes(e.key))
    .forEach(e=>{lo=Math.min(lo,e.lo);hi=Math.max(hi,e.hi);}));
  lo=Math.min(lo,1/1.15); hi=Math.max(hi,1.15);
  const W=Math.max(230,330-(selOut.length-1)*16), PADL=6, PADR=16,
        H=26*rows.length+56, X0=PADL, X1=W-PADR;
  const sx=v=>X0+(Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo))*(X1-X0);

  selOut.forEach((k,ci)=>{
    const o=O(k), E=ests(o), blk=(level==="regime"?o.regime:o.channel);
    const d=document.createElement("div"); d.className="plot";
    let svg=`<svg width="${W+ (ci===0?170:0)}" height="${H}" font-family="Helvetica Neue,Helvetica,Arial" font-size="11.5">`;
    const OX = ci===0?170:0;
    // axis
    const ticks=[0.5,0.7,1,1.5,2,3].filter(t=>t>=lo*0.98&&t<=hi*1.02);
    svg+=`<line x1="${OX+sx(1)}" y1="34" x2="${OX+sx(1)}" y2="${H-20}" stroke="${PAL.faint}" stroke-width="1"/>`;
    ticks.forEach(t=>{svg+=`<text x="${OX+sx(t)}" y="${H-6}" fill="${PAL.mid}" font-size="10" text-anchor="middle">${t}</text>
      <line x1="${OX+sx(t)}" y1="${H-20}" x2="${OX+sx(t)}" y2="${H-17}" stroke="${PAL.faint}"/>`;});
    rows.forEach((rk,i)=>{
      const e=E.find(x=>x.key===rk); const y=44+i*26;
      if(ci===0) svg+=`<text x="0" y="${y+4}" fill="${PAL.ink}" font-size="12">${labelOf(rk)}</text>`;
      if(!e){svg+=`<text x="${OX+sx(1)}" y="${y+4}" fill="${PAL.faint}" font-size="10.5" text-anchor="middle">not fielded</text>`;return;}
      const sig=!(e.lo<1&&e.hi>1);
      const col=!sig?PAL.mid:(e.odds_ratio<1?PAL.obs:PAL.priv);
      svg+=`<line x1="${OX+sx(e.lo)}" y1="${y}" x2="${OX+sx(e.hi)}" y2="${y}" stroke="${col}" stroke-width="1.4"/>
            <circle cx="${OX+sx(e.odds_ratio)}" cy="${y}" r="${sig?4.2:3.4}" fill="${sig?col:PAL.bg}" stroke="${col}" stroke-width="1.4"/>`;
      if(e.restricted) svg+=`<text x="${OX+sx(e.hi)+6}" y="${y+3.5}" fill="${PAL.faint}" font-size="9.5">6 waves</text>`;
    });
    svg+=`</svg>`;
    d.innerHTML=`<h3>${o.label}</h3>
      <p class="pmeta">${blk.prevalence.toFixed(1)}% ${o.direction==="trust"?"trusting":"believing"} ·
         n=${blk.n.toLocaleString()} · ${blk.waves.length} waves</p>${svg}`;
    plots.appendChild(d);
  });

  // table
  let t=`<table><thead><tr><th>News source</th>`;
  selOut.forEach(k=>t+=`<th>${O(k).label}</th>`);
  t+=`</tr></thead><tbody>`;
  rows.forEach(rk=>{
    t+=`<tr><td>${labelOf(rk)}</td>`;
    selOut.forEach(k=>{
      const e=ests(O(k)).find(x=>x.key===rk);
      if(!e){t+=`<td style="color:${PAL.faint}">—</td>`;return;}
      const sig=!(e.lo<1&&e.hi>1);
      t+=`<td style="color:${sig?(e.odds_ratio<1?PAL.obs:PAL.priv):PAL.mid}">
          ${e.odds_ratio.toFixed(3)} <span style="color:${PAL.faint};font-size:11px">[${e.lo.toFixed(2)}, ${e.hi.toFixed(2)}]</span></td>`;
    });
    t+=`</tr>`;
  });
  t+=`</tbody></table>`;
  tables.innerHTML=t;
  document.getElementById("footnote").innerHTML=
    `Odds ratios from survey-weighted logistic regressions, one model per outcome, with every
     news source entered <em>jointly</em> and adjusted for party identification, education, age,
     household income, gender and wave fixed effects. <strong>Toggling sources filters the display
     of a fitted model; it does not re-estimate.</strong> Blue is below 1, purple above 1, grey
     spans 1. AI Chat is fielded in six waves only and its estimate comes from a separate model on
     those waves. Trust outcomes are “a lot” or “some”; conspiracy items are “agree” or “strongly
     agree”; election denial is agreement that Trump would have won a fairly counted 2020 election.
     These are cross-sectional associations confounded with selective exposure, not transmission
     rates. Built ${DATA.meta.built} · ${DATA.meta.note}`;
}
</script>
</body>
</html>
